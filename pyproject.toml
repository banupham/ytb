[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ytb-radar"
version = "0.3.0"
description = "Experimental YouTube recommendation graph radar with topic, cohort, persistence and niche-specificity analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.2,<4",
  "playwright>=1.50,<2"
]

[project.scripts]
ytb-radar = "ytb_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
